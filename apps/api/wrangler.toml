name = "vault-wallpaper-api"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "api.awall.cc", custom_domain = true }
]

# Local default: `pnpm --filter @vault/api dev` uses `wrangler dev --local`
# (Miniflare disk KV/R2 — does NOT count against Cloudflare free-tier caps).
# Use `pnpm --filter @vault/api dev:remote` only when you intentionally need
# cloud KV/R2/AI (same account daily limits as production).
#
# preview_id should be a SEPARATE namespace if you use --remote often;
# reusing production id means local remote-dev writes burn prod quota.
[[kv_namespaces]]
binding = "KV"
id = "3ff6aac757d44bd0baf041b1cba43d38"
preview_id = "3ff6aac757d44bd0baf041b1cba43d38"

[[r2_buckets]]
binding = "R2"
bucket_name = "awall-wallpaper"
preview_bucket_name = "vault-wallpaper-preview"

[vars]
APP_NAME = "awall"
PUBLIC_ORIGIN = "https://awall.cc"
CF_ACCOUNT_ID = "be468fd8562e32b870221a6b8a458629"
CF_KV_NAMESPACE_ID = "3ff6aac757d44bd0baf041b1cba43d38"
CF_WORKER_SCRIPT_NAME = "vault-wallpaper-api"
CF_R2_BUCKET_NAME = "awall-wallpaper"

[ai]
binding = "AI"

[images]
binding = "IMAGES"

# Secrets via `wrangler secret put` or .dev.vars:
# JWT_SECRET, RESEND_API_KEY, EMAIL_FROM,
# XUNHUPAY_APPID, XUNHUPAY_APPSECRET, XUNHUPAY_GATEWAY,
# CF_API_TOKEN  (Account Analytics Read — for admin KV usage charts)
# DEEPSEEK_API_KEY  (AiEditor / announcements rich-text AI)
